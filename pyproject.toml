[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "approxkit"
version = "0.1.0"
description = "Bit-accurate approximate adders/multipliers, error metrics, Pareto explorer, Verilog"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy"]
license = { text = "MIT" }

[project.optional-dependencies]
plots = ["matplotlib"]
test = ["pytest"]

[tool.setuptools]
packages = ["approxkit"]
