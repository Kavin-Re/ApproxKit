[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "approxkit"
version = "0.1.0"
description = "Bit-accurate approximate adders and multipliers: Python models, error metrics, Pareto design-space exploration and matching Verilog"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kavin K K" }]
keywords = ["approximate computing", "approximate adder", "approximate multiplier", "verilog", "design space exploration", "error metrics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = ["numpy"]

[project.optional-dependencies]
plots = ["matplotlib"]
test = ["pytest"]
dev = ["pytest", "matplotlib", "ruff"]

[project.urls]
Homepage = "https://github.com/Kavin-Re/ApproxKit"
Issues = "https://github.com/Kavin-Re/ApproxKit/issues"

[tool.setuptools]
# Only the core library is installable. v2/ (signed multipliers, dividers,
# squarers, application-quality study) is a research extension run from the
# source tree; see v2/README.md.
packages = ["approxkit"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests", "v2/tests"]
pythonpath = [".", "v2", "v2/scripts"]
addopts = "-ra"

[tool.ruff]
line-length = 130
target-version = "py39"
extend-exclude = ["build"]

[tool.ruff.lint]
# Correctness rules only; the code base uses a compact style on purpose.
select = ["E9", "F"]
